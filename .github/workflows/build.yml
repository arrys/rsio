name:  Packages the python source code into executables using pyinstaller.

on:
  release:
    types: [created]

jobs:
  pyinstaller-build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uvx
        run: |
          curl -Ls https://astral.sh/uv/install.ps1 | iex
          uvx create --python 3.12 rsio-env

      - name: Install dependencies from pyproject.toml
        run: |
          uvx install .[doc]

      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.10'
          upload_exe_with_name: 'rsio-windows'
          options: --onefile, --name "rsio-cli"

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          files: ./dist/*
